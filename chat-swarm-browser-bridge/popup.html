<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chat Swarm Wake Bridge</title>
  <style>
    body{font:13px system-ui,sans-serif;margin:12px;width:290px;color:#111}
    h1{font-size:14px;margin:0 0 10px}
    label{display:block;margin:8px 0 4px}
    input{box-sizing:border-box;width:100%;padding:7px 8px}
    button{margin-top:10px;width:100%;padding:8px 10px;cursor:pointer}
    #status{margin-top:9px;min-height:18px;font-size:12px;white-space:pre-wrap}
  </style>
</head>
<body>
  <h1>Chat Swarm Wake Bridge</h1>
  <label for="baseUrl">DevSpace base URL</label>
  <input id="baseUrl" autocomplete="url" spellcheck="false" placeholder="https://your-devspace.example.com">
  <label for="invite">Invite code</label>
  <input id="invite" autocomplete="off" spellcheck="false" placeholder="C984634D1BEE">
  <button id="activate">Activate current tab</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
