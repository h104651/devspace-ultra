name: vNext Cloudflare Credential Preflight

on:
  push:
    branches:
      - feature/vnext-remote-gateway
    paths:
      - '.github/workflows/vnext-cloudflare-preflight.yml'
  workflow_dispatch:

jobs:
  cloudflare-credential-preflight:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vnext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Verify Cloudflare API token is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::CLOUDFLARE_API_TOKEN is not configured in GitHub Actions.'
            exit 1
          fi
          echo 'Cloudflare API token is configured (value not printed).'
      - name: Verify Cloudflare authentication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler whoami >/dev/null
