<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevSpace Browser Control</title>
  <style>
    :root{color-scheme:light;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f7f9fc}
    *{box-sizing:border-box}
    body{margin:0;width:350px;background:#f7f9fc}
    main{padding:16px}
    h1{font-size:17px;margin:0 0 4px}
    .sub{font-size:12px;color:#65748b;margin-bottom:14px}
    .card{background:white;border:1px solid #dce4ee;border-radius:12px;padding:12px;margin-bottom:10px}
    label{display:block;font-size:11px;font-weight:700;color:#536176;margin:9px 0 4px}
    input,select{width:100%;border:1px solid #cfd9e5;border-radius:8px;padding:8px 9px;background:#fff;color:#172033;font:12px inherit}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    button{border:0;border-radius:9px;padding:9px 10px;font:600 12px inherit;cursor:pointer}
    button.primary{background:#2477e6;color:white;width:100%;margin-top:10px}
    button.secondary{background:#eaf2fe;color:#1f64be}
    button.danger{background:#fff0f0;color:#b64747}
    button:disabled{opacity:.5;cursor:default}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
    .status{font-size:12px;line-height:1.5;color:#526277;min-height:18px;word-break:break-word}
    .ok{color:#198963}.bad{color:#b64747}
    .switch{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:#425168}
    .switch input{width:auto}
    .pill{display:inline-block;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:700;background:#eef4fb;color:#47709e;margin-left:6px}
    code{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;color:#37516f}
  </style>
</head>
<body>
<main>
  <h1>DevSpace Browser Control <span id="statePill" class="pill">Disconnected</span></h1>
  <div class="sub">Claim existing Chrome tabs or let an agent open a new work tab.</div>

  <div class="card" id="pairCard">
    <label for="endpoint">Local DevSpace endpoint</label>
    <input id="endpoint" value="http://127.0.0.1:7676" spellcheck="false">
    <label for="label">Chrome profile label</label>
    <input id="label" value="Chrome" maxlength="80">
    <label for="pairCode">One-time pair code</label>
    <input id="pairCode" placeholder="Get code from browser_control_pair" autocomplete="off" spellcheck="false">
    <label for="accessMode">Tab access</label>
    <select id="accessMode">
      <option value="selected">Only tabs I explicitly share</option>
      <option value="all">All normal browser tabs</option>
    </select>
    <label class="switch"><input id="developerMode" type="checkbox"> Enable Developer mode (full supported CDP)</label>
    <button id="pair" class="primary">Pair with DevSpace</button>
  </div>

  <div class="card" id="controlCard">
    <div class="status" id="status">Loading…</div>
    <div class="actions">
      <button id="share" class="secondary">Share current tab</button>
      <button id="unshare" class="secondary">Unshare current tab</button>
    </div>
    <div class="actions">
      <button id="savePrefs" class="secondary">Save preferences</button>
      <button id="disconnect" class="danger">Disconnect</button>
    </div>
  </div>

  <div class="sub">Security: the bridge only connects to localhost. Programmatic password entry is blocked; enter credentials directly in Chrome.</div>
</main>
<script src="popup.js"></script>
</body>
</html>
